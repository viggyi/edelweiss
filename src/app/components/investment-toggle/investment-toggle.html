<div class="input-cus-toggle flex bg-gray-100 rounded-full text-[11px] min-w-[156px] min-h-[32.5px]">
  <button
    (click)="setActive('lumpsum')"
    class="px-3 py-1 w-[50%] rounded-full transition-all duration-200 font-semibold"
    [class.bg-white]="active() === 'lumpsum'"
    [class.shadow]="active() === 'lumpsum'"
    [class.text-brand]="active() === 'lumpsum'"
    [class.text-gray-500]="active() !== 'lumpsum'"
  >
    Lumpsum
  </button>
  <button
    (click)="setActive('sip')"
    class="px-3 py-1 w-[50%] rounded-full transition-all duration-200 font-semibold"
    [class.bg-white]="active() === 'sip'"
    [class.shadow]="active() === 'sip'"
    [class.text-brand]="active() === 'sip'"
    [class.text-gray-500]="active() !== 'sip'"
  >
    SIP
  </button>
</div>
